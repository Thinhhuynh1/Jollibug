# Database MySQL Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/mynewprojectdb
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=timo
spring.datasource.password=0710
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# Tắt Hibernate tự tạo bảng, dùng schema.sql thay thế
spring.jpa.hibernate.ddl-auto=none
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true

#Cho phép thực thi file sql để tạo bảng và đổ dữ liệu
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
#Bỏ qua lỗi DROP TABLE khi bảng chưa tồn tại
spring.sql.init.continue-on-error=true
#Đảm bảo schema/data chạy trước Hibernate
spring.jpa.defer-datasource-initialization=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

