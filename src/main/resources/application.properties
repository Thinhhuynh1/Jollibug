# Database Oracle Configuration
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/orclpdb
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=fastfooddb
spring.datasource.password=123456
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# Không để Hibernate tự ALTER bảng Oracle (gây ORA-02267)
# Tạo bảng mới thủ công bằng SQL rồi đảnh sang validate
spring.jpa.hibernate.ddl-auto=none
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true

# #Cho phép thực thi file sql để đổ dữ liệu
# spring.sql.init.mode=always
# #Chỉ định vị trí file dữ liệu (mặc định là src/main/resources/data.sql)
# spring.sql.init.data-locations=classpath:data.sql
# #Đảm bảo Hibernate không can thiệp vào quá trình khởi tạo dữ liệu của Spring
# spring.jpa.defer-datasource-initialization=true

#config spring security
spring.security.user.name=user
spring.security.user.password=123

# multipart upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
