# Database MySQL Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/orclpdb
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=fastfooddb
spring.datasource.password=123456
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jpa.properties.hibernate.jdbc.fetch_size=100
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
# xóa dữ liệu trong db và tạo mới
spring.jpa.hibernate.ddl-auto=create
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=true

#Cho phép thực thi file sql để đổ dữ liệu
spring.sql.init.mode=always
#Chỉ định vị trí file dữ liệu (mặc định là src/main/resources/data.sql)
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
#Đảm bảo Hibernate không can thiệp vào quá trình khởi tạo dữ liệu của Spring
spring.jpa.defer-datasource-initialization=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

#config spring security
spring.security.user.name=user
spring.security.user.password=123

